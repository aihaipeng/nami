[package]
name = "nami"
version = "0.1.0"
description = "Nami desktop translation and clipboard app"
edition = "2021"
rust-version = "1.100"

[features]
ui-tests = ["dep:block2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
html-escape = "0.2"
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSScrollView", "NSButton", "NSControl", "NSCell", "NSButtonCell"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
