[package]
name = "nami"
version = "0.1.0"
description = "Nami desktop translation and clipboard app"
repository = "https://github.com/aihaipeng/nami.git"
edition = "2021"
rust-version = "1.100"
default-run = "nami"

[[bin]]
name = "export-history-icons"
path = "src/bin/export-history-icons.rs"
required-features = ["ui-tests"]

[[bin]]
name = "cross-app-fixture"
path = "src/bin/cross-app-fixture.rs"
required-features = ["cross-app-fixture"]

[features]
cross-app-fixture = ["objc2-app-kit/NSResponder", "objc2-app-kit/NSText", "objc2-app-kit/NSTextView"]
portable-ui = []
ui-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
html-escape = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
sha2 = "0.10"
rusqlite = { version = "0.42.0", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "block2", "NSView", "NSScrollView", "NSButton", "NSControl", "NSCell", "NSButtonCell", "NSWindow", "NSTextField"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageProperties"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNTypes", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "objc2-image-io"] }
