[pytest]
testpaths = tests/python
addopts = -ra --strict-markers
markers =
    native: builds and runs isolated macOS native UI regression
    signing: checks synthetic bundles against the configured local signing identity
    tools: builds and checks isolated macOS developer tools
    dfx_security: signing identity and privacy protection checks
    dfx_diagnostics: report freshness, completeness, and failure reporting
    dfx_compatibility: cross-platform tooling and capability boundaries
